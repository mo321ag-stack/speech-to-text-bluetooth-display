name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware (avr-gcc, ATmega32A)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Speech_To_Text_Bluetooth_Display/Firmware
    steps:
      - uses: actions/checkout@v5
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr
      - name: Build (warnings are errors)
        run: make
      - uses: actions/upload-artifact@v5
        with:
          name: bt_display-hex
          path: Speech_To_Text_Bluetooth_Display/Firmware/bt_display.hex

  app:
    name: App (Flutter analyze + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Speech_To_Text_Bluetooth_Display/Mobile_App/speech_bt_display
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
